[project]
name = "chemingator"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pyink>=26.5.1",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = false
target-version = ["py312"]

[tool.isort]
profile = "google"
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chemingator"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
